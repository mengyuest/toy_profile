name: generate dynamic profile assets

# Renders the live stats terminal card and pushes it to the `output` branch.
# Palette matches PROFILE_README.md throughout.
# See ../README.md for the one-time deploy steps.
#
# (Previously also generated a contribution-snake animation via Platane/snk —
# cut per user feedback: it's a non-interactive autoplay SVG with no viewer
# control, purely decorative, and the piece of the page most likely to break
# silently. If it comes back, add its step here rather than a second workflow,
# since two workflows both deploying to `output` would clobber each other.)

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout (for scripts/generate_stats_svg.py)
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: generate stats-{dark,light}.svg
        env:
          GITHUB_STATS_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats_svg.py dist

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

